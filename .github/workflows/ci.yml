name: Validate Workflow, Data & Docs

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the n8n workflow files and the data from the real run
        run: |
          python3 - <<'PY'
          import csv, json
          w = json.load(open('workflows/sender-domain-health.n8n.json'))
          err = json.load(open('workflows/error-notifier.n8n.json'))
          assert len(w['nodes']) == 10 and len(err['nodes']) == 2
          assert '$vars' not in json.dumps(w), "Community n8n does not support $vars"
          names = {n['name'] for n in w['nodes']}
          targets = {t['node'] for c in w['connections'].values() for group in c['main'] for t in group}
          assert targets <= names and set(w['connections']) <= names, "A connection points at a missing node"
          lookups = [n for n in w['nodes'] if n['name'].startswith('DNS Lookups')][0]
          assert 'this.helpers.httpRequest' in lookups['parameters']['jsCode'] and 'credentials' not in lookups
          for wf in (w, err):
              for n in wf['nodes']:
                  assert 'credentials' not in n, "Workflow files must not carry credentials"
                  if n['type'] == 'n8n-nodes-base.slack':
                      assert n['parameters'].get('select') == 'channel' and 'channelId' in n['parameters']
          rows = list(csv.DictReader(open('data/italian-b2b-sample-2026-11-21.csv')))
          assert len(rows) == 20 and not any('.' in r['id'] for r in rows), "The sample has 20 rows and no domain names"
          own = json.load(open('data/own-domains-2026-11-21.json'))
          assert [v['domain'] for v in own] == ['negozio-online.org', 'send.negozio-online.org', 'mionegozio.com']
          PY
          test -f docs/rules.md
          test -f docs/index.html
          test -f docs/field-notes/klaviyo-shopify-field-notes.md
      - name: Run the workflow's nodes against canned DNS answers
        run: node tests/workflow.test.mjs
