name: Validate Workflows & Policy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify n8n workflow JSON, store policy JSON, and required docs
        run: |
          python3 -c "import json; w=json.load(open('workflows/ai-email-preflight-qa.n8n.json')); p=json.load(open('config/store-facts-and-promo-policy.json')); assert len(w['nodes'])==8 and 'discount_policy' in p"
          test -f prompts/email-policy-qa-prompt.md
          test -f docs/vip-margin-protection-rules.md
          test -f docs/sop-pre-send-qa-checklist.md
          test -f docs/field-notes/klaviyo-shopify-field-notes.md
