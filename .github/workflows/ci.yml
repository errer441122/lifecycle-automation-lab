name: Validate Workflows & Policy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify n8n workflow JSONs, Code node parser, Slack v2.2 itemized blockers, policy JSON, and docs
        run: |
          python3 - <<'PY'
          import json
          w = json.load(open('workflows/ai-email-preflight-qa.n8n.json'))
          err = json.load(open('workflows/error-notifier.n8n.json'))
          p = json.load(open('config/store-facts-and-promo-policy.json'))
          assert len(w['nodes']) == 8 and len(err['nodes']) == 2 and 'discount_policy' in p
          rules = [n for n in w['nodes'] if n['name'] == 'Rules: Fixed Checks (No AI)'][0]
          assert rules['type'] == 'n8n-nodes-base.code', "Fixed checks run as code, not AI"
          ai = [n for n in w['nodes'] if n['name'].startswith('AI:')][0]
          assert '>50 chars' not in ai['parameters']['jsonBody'], "Subject length is a fixed rule"
          assert '$vars' not in json.dumps(w)
          assert any(n['type'] == 'n8n-nodes-base.code' for n in w['nodes']), "AI parser must be a real Code node"
          blocked = [n for n in w['nodes'] if 'BLOCKED' in n['name']][0]
          assert 'b.category' in blocked['parameters']['text'] and 'b.fix' in blocked['parameters']['text']
          for wf in (w, err):
              for n in wf['nodes']:
                  if n['type'] == 'n8n-nodes-base.slack':
                      assert n['parameters'].get('select') == 'channel' and 'channelId' in n['parameters']
          PY
          test -f prompts/email-policy-qa-prompt.md
          test -f docs/vip-margin-protection-rules.md
          test -f docs/sop-pre-send-qa-checklist.md
          test -f docs/field-notes/klaviyo-shopify-field-notes.md
      - name: Run the fixed-rule checks on the example drafts
        run: node tests/fixed-rules.test.mjs
